  <!-- annotations -->
  <text x="668" y="428" text-anchor="middle" fill="#f0b66b" font-size="12.5" font-weight="600">overrides PlayRandomAttack</text>

  <!-- legend -->
  <text x="850" y="478" text-anchor="middle" fill="#8fa0bd" font-size="14">Shared skill pipeline in the base class · side-specific behaviour in Hero / Enemy · characters are data-configured children (PDA_Character, PDA_Action)</text>
