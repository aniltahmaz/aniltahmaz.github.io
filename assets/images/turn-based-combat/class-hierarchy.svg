    <rect x="606" y="350" width="124" height="52" rx="8"/>
    <rect x="738" y="350" width="124" height="52" rx="8"/>
    <rect x="870" y="350" width="124" height="52" rx="8"/>
    <rect x="1002" y="350" width="124" height="52" rx="8"/>
    <rect x="1134" y="350" width="124" height="52" rx="8"/>
    <rect x="1266" y="350" width="124" height="52" rx="8"/>
    <rect x="1398" y="350" width="124" height="52" rx="8"/>
    <rect x="1530" y="350" width="124" height="52" rx="8"/>
  </g>
  <g fill="#fbeaea" font-size="11.5" text-anchor="middle">
    <text x="668" y="381">BP_EnemyDogPhysical</text>
    <text x="800" y="381">BP_EnemyDogBlack</text>
    <text x="932" y="381">BP_Boss</text>
    <text x="1064" y="381">BP_Enemy01</text>
    <text x="1196" y="381">BP_Enemy02</text>
    <text x="1328" y="381">BP_Enemy03</text>
    <text x="1460" y="381">BP_TentacleKnight</text>
